plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.xixka.qbittorrent'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.xixka.qbittorrent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Two editions of the client share the same code base:
    //  * standard — pure remote control client for a qBittorrent/qBittorrent-nox server
    //  * enhanced — additionally bundles qbittorrent-enhanced-nox (local engine, OpenListAndroid build)
    flavorDimensions "edition"
    productFlavors {
        standard {
            dimension "edition"
            applicationId "io.github.xixka.qbittorrent"
            resValue "string", "app_name", "qBittorrent"
            buildConfigField "boolean", "IS_ENHANCED", "false"
        }
        enhanced {
            dimension "edition"
            applicationId "io.github.xixka.qbittorrent.enhanced"
            versionNameSuffix "-enhanced"
            resValue "string", "app_name", "qBittorrent Enhanced"
            buildConfigField "boolean", "IS_ENHANCED", "true"
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // The enhanced edition ships libqbittorrent-nox.so in jniLibs and exec()s it from
    // nativeLibraryDir, which requires legacy packaging (extracted, executable).
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
