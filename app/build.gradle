plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Version scheme: versionName = YY.MM.DD, versionCode = YYMMDDHHt (9 digits,
// t = ten-minute digit 0-5). CI passes them via -PversionName / -PversionCode;
// local builds fall back to 1.0.0 / 1.
def appVersionName = (project.findProperty('versionName') ?: '1.0.0').toString()
def appVersionCode = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())

android {
    namespace 'io.github.xixka.qbittorrent'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.xixka.qbittorrent"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        vectorDrawables {
            useSupportLibrary true
        }
        // Single edition: the app ALWAYS bundles the local
        // qbittorrent-enhanced-nox engine and can ALSO remote-control any
        // qBittorrent server (Settings → Server). One edition, one release.
        resValue "string", "app_name", "qBittorrent Enhanced"
        buildConfigField "boolean", "IS_ENHANCED", "true"
    }

    // One APK per ABI (arm64-v8a / armeabi-v7a / x86_64) so the app — which
    // bundles a ~30 MB native engine per ABI — stays installable on slow
    // networks and restricted storage. CI publishes the split APKs; there is
    // no universal APK (it would triple the download size).
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    // Distinct versionCodes per ABI (universal keeps the base code, then
    // arm64 > armv7 > x86_64 so device-side downgrade protection works).
    def abiVersionCode = [
            'arm64-v8a'   : 3,
            'armeabi-v7a' : 2,
            'x86_64'      : 1,
    ]
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride = variant.versionCode + (abiVersionCode[abi] ?: 0)
                outputFileName = "app-${abi}-${variant.buildType.name}.apk"
            }
        }
    }

    // CI release signing: a committed, public self-signed key so every build
    // (including the ones from GitHub Releases) carries the SAME signature
    // and can be updated in place. This is for sideloaded FOSS builds only —
    // it proves build continuity, not developer identity.
    signingConfigs {
        ci {
            storeFile file('ci-signing.keystore')
            storePassword 'ci-qbt-android'
            keyAlias 'qbandroid'
            keyPassword 'ci-qbt-android'
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // no more unsigned release APKs — releases are CI-signed and
            // installable directly
            signingConfig signingConfigs.ci
        }
    }

    // The app ships libqbittorrent-nox.so in jniLibs and exec()s it from
    // nativeLibraryDir, which requires legacy packaging (extracted, executable).
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
